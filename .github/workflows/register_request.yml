name: Register Pending License Request

on:
  repository_dispatch:
    types: [request_access]

jobs:
  add-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update licenses.json with Pending Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const email = context.payload.client_payload.email.toLowerCase().trim();
            const machineId = context.payload.client_payload.machineId;
            
            const filePath = './licenses.json';
            let data = { licenses: [] };
            if (fs.existsSync(filePath)) {
              data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            }
            
            let existing = data.licenses.find(l => l.email.toLowerCase() === email);
            
            if (existing) {
              // Ensure machineIds is an array (migrating legacy machineId string if necessary)
              if (!existing.machineIds) {
                existing.machineIds = existing.machineId ? [existing.machineId] : [];
                delete existing.machineId;
              }
              // Add new machine if not already registered for this user
              if (!existing.machineIds.includes(machineId)) {
                existing.machineIds.push(machineId);
                existing.status = "pending"; // Flag pending status so admin re-approves the new device
                console.log(`Added new device ${machineId} for existing user ${email}`);
              } else {
                console.log(`Device ${machineId} already recorded for ${email}`);
              }
            } else {
              // Brand new user request
              data.licenses.push({
                email: email,
                machineIds: [machineId],
                expires: "",
                status: "pending"
              });
              console.log(`Added new pending user request for ${email}`);
            }
            
            fs.writeFileSync(filePath, JSON.stringify(data, null, 2));

      - name: Commit & Push Changes
        run: |
          git config --global user.name "LicenseHub Bot"
          git config --global user.email "bot@licensehub.local"
          git add licenses.json
          git commit -m "Auto-register pending request/device from extension" || exit 0
          git push
